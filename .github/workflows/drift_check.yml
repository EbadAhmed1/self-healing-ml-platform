name: Scheduled Drift & Monitoring Job

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-drift-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Feature Drift Check (churn-model)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python monitoring/check_drift.py --hours 24 --model-name churn-model

      - name: Execute Feature Drift Check (fraud-model)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python monitoring/check_drift.py --hours 24 --model-name fraud-model

      - name: Execute Accuracy Check (churn-model)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python monitoring/check_accuracy.py --hours 24 --model-name churn-model

      - name: Execute Diagnosis Agent Loop
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python agent/run_agent.py --once
